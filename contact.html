<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us — Pixel Color Picker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px;
      background-color: #1a1a2e;
      color: #f0f0f0;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    p.subtitle {
      font-size: 0.9rem;
      opacity: 0.6;
      margin-bottom: 28px;
    }

    .back-link {
      align-self: flex-start;
      margin-bottom: 24px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.78rem;
      color: rgba(240,240,240,0.5);
      text-decoration: none;
      letter-spacing: 0.04em;
      transition: color 0.15s;
    }

    .back-link:hover { color: rgba(240,240,240,0.85); }

    #contact-section {
      width: 100%;
      max-width: 480px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .form-group label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: rgba(240,240,240,0.55);
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    .form-group input,
    .form-group textarea {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 5px;
      color: #f0f0f0;
      font: inherit;
      font-size: 0.88rem;
      padding: 10px 13px;
      transition: border-color 0.15s, background 0.15s;
      resize: vertical;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: rgba(240,240,240,0.25);
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: rgba(228,87,46,0.55);
      background: rgba(255,255,255,0.08);
    }

    .form-group input.invalid,
    .form-group textarea.invalid {
      border-color: rgba(228,87,46,0.9);
    }

    .field-error {
      font-size: 0.72rem;
      color: #e4572e;
      min-height: 1em;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    #submit-btn {
      width: 100%;
      padding: 11px 20px;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: #fff6f1;
      cursor: pointer;
      background: #e4572e;
      border: 1px solid rgba(0,0,0,0.35);
      border-radius: 5px;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.28),
        0 2px 0 #9d3a1b;
      transition: background 0.15s ease;
      margin-top: 8px;
    }

    #submit-btn:hover { background: #f06136; }

    #submit-btn:active {
      transform: translateY(2px);
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.3), 0 0 0 #9d3a1b;
    }

    #submit-btn:focus-visible {
      outline: 2px solid #f2c14e;
      outline-offset: 2px;
    }

    #submit-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    #form-success {
      display: none;
      margin-top: 16px;
      padding: 14px 18px;
      background: rgba(58,175,169,0.12);
      border: 1px solid rgba(58,175,169,0.35);
      border-radius: 6px;
      font-size: 0.85rem;
      color: #3aafa9;
      text-align: center;
    }

    footer {
      margin-top: auto;
      padding-top: 32px;
      display: flex;
      gap: 20px;
      font-size: 0.75rem;
      color: rgba(240,240,240,0.35);
    }

    footer a {
      color: inherit;
      text-decoration: none;
      transition: color 0.15s;
    }

    footer a:hover { color: rgba(240,240,240,0.7); }
  </style>
</head>
<body>

  <a class="back-link" href="index.html">&#8592; Back to Color Picker</a>

  <h1>Contact Us</h1>
  <p class="subtitle">Have a question or feedback? We'd love to hear from you.</p>

  <section id="contact-section">
    <form id="contact-form" novalidate>
      <div class="form-group">
        <label for="contact-name">Name</label>
        <input type="text" id="contact-name" name="name" placeholder="Your name" autocomplete="name" />
        <span class="field-error" id="name-error"></span>
      </div>
      <div class="form-group">
        <label for="contact-email">Email</label>
        <input type="email" id="contact-email" name="email" placeholder="you@example.com" autocomplete="email" />
        <span class="field-error" id="email-error"></span>
      </div>
      <div class="form-group">
        <label for="contact-subject">Subject</label>
        <input type="text" id="contact-subject" name="subject" placeholder="What's this about?" />
        <span class="field-error" id="subject-error"></span>
      </div>
      <div class="form-group">
        <label for="contact-message">Message</label>
        <textarea id="contact-message" name="message" rows="5" placeholder="Your message…"></textarea>
        <span class="field-error" id="message-error"></span>
      </div>
      <button type="submit" id="submit-btn">Send Message</button>
      <div id="form-success">Your message has been sent! We'll get back to you soon.</div>
    </form>
  </section>

  <footer>
    <a href="#">Privacy Policy</a>
    <a href="#">Cookies</a>
  </footer>

  <script>
    const contactForm = document.getElementById('contact-form');
    const submitBtn = document.getElementById('submit-btn');
    const formSuccess = document.getElementById('form-success');

    const fields = {
      name:    { el: document.getElementById('contact-name'),    err: document.getElementById('name-error') },
      email:   { el: document.getElementById('contact-email'),   err: document.getElementById('email-error') },
      subject: { el: document.getElementById('contact-subject'), err: document.getElementById('subject-error') },
      message: { el: document.getElementById('contact-message'), err: document.getElementById('message-error') },
    };

    function validateField(key) {
      const { el, err } = fields[key];
      const val = el.value.trim();
      let msg = '';

      if (key === 'name' && !val) msg = 'Name is required.';
      else if (key === 'email') {
        if (!val) msg = 'Email is required.';
        else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) msg = 'Enter a valid email address.';
      }
      else if (key === 'subject' && !val) msg = 'Subject is required.';
      else if (key === 'message' && !val) msg = 'Message is required.';

      err.textContent = msg;
      el.classList.toggle('invalid', !!msg);
      return !msg;
    }

    Object.keys(fields).forEach(key => {
      fields[key].el.addEventListener('blur', () => validateField(key));
      fields[key].el.addEventListener('input', () => {
        if (fields[key].el.classList.contains('invalid')) validateField(key);
      });
    });

    contactForm.addEventListener('submit', e => {
      e.preventDefault();
      const valid = Object.keys(fields).map(validateField).every(Boolean);
      if (!valid) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending…';

      setTimeout(() => {
        contactForm.reset();
        Object.values(fields).forEach(({ el }) => el.classList.remove('invalid'));
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Message';
        formSuccess.style.display = 'block';
        setTimeout(() => { formSuccess.style.display = 'none'; }, 5000);
      }, 800);
    });
  </script>
</body>
</html>
